<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taraz | طراز</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="app">
        <!-- Screen 1: Home (Dashboard) -->
        <section id="screen-home" class="screen active">
            <header class="app-header">
                <div class="user-info">
                    <div class="avatar"></div>
                    <div class="user-text">
                        <span class="user-name">کاربر گرامی</span>
                        <span class="user-status">در دسترس</span>
                    </div>
                </div>
                <button class="icon-btn"><i class="fas fa-bell"></i></button>
            </header>

            <main class="content">
                <div class="market-pulse">
                    <h3><i class="fas fa-chart-line"></i> نبض بازار</h3>
                    <div class="pulse-card">
                        <span>گوشت گوسفندی: <strong>۲۸۰,۰۰۰</strong> تومان</span>
                        <span class="trend up"><i class="fas fa-arrow-up"></i> ۲٪</span>
                    </div>
                </div>

                <div class="quick-actions">
                    <button class="action-card" onclick="go('listings')">
                        <i class="fas fa-list"></i>
                        <span>لیست‌ها</span>
                    </button>
                    <button class="action-card" onclick="go('missions')">
                        <i class="fas fa-truck-loading"></i>
                        <span>مأموریت‌ها</span>
                    </button>
                </div>
            </main>
        </section>

        <!-- Screen 2: Map Home (The Snap-like Experience) -->
        <section id="screen-map-home" class="screen">
            <div id="main-map"></div>
            
            <!-- Map Overlays (Search/Filter) -->
            <div class="map-overlay-top">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="جستجوی مأموریت یا مکان...">
                </div>
            </div>

            <!-- Snap-like Mission Selection (Bottom Sheet) -->
            <div class="mission-bottom-sheet">
                <div class="drag-handle"></div>
                <div class="sheet-content">
                    <h4>مأموریت‌های نزدیک</h4>
                    <div class="mission-item">
                        <div class="item-info">
                            <span class="title">انتقال گوسفند (تلی)</span>
                            <span class="loc"><i class="fas fa-map-marker-alt"></i> تهران ➔ اصفهان</span>
                        </div>
                        <button class="btn-select">مشاهده</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Screen 3: Listings -->
        <section id="screen-listings" class="screen">
            <header class="app-header">
                <button class="back-btn" onclick="go('home')"><i class="fas fa-chevron-right"></i></button>
                <h1>لیست‌های موجود</h1>
            </header>
            <div class="content">
                <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Other screens (Bookings, Conversations, etc.) would follow the same pattern -->
    </div>

    <!-- Main Bottom Navigation -->
    <nav class="nav" id="nav">
        <a href="#" class="nav-item active" onclick="go('home')">
            <i class="fas fa-home"></i>
            <span>خانه</span>
        </a>
        <a href="#" class="nav-item" onclick="go('map')">
            <i class="fas fa-map-marked-alt"></i>
            <span>مأموریت</span>
        </a>
        <a href="#" class="nav-item center-btn" onclick="go('missions')">
            <div class="pulse-circle">
                <i class="fas fa-plus"></i>
            </div>
        </a>
        <a href="#" class="nav-item" onclick="go('conversations')">
            <i class="fas fa-comment-dots"></i>
            <span>گفتگو</span>
        </a>
        <a href="#" class="nav-item" onclick="go('profile')">
            <i class="fas fa-user"></i>
            <span>من</span>
        </a>
    </nav>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
